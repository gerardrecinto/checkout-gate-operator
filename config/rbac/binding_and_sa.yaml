apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-gate-operator
  namespace: checkout-gate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: checkout-gate-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: checkout-gate-operator-manager
subjects:
  - kind: ServiceAccount
    name: checkout-gate-operator
    namespace: checkout-gate-system
