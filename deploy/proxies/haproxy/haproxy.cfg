global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 1s
  timeout client  10s
  timeout server  10s

frontend tls_in
  bind :8443 ssl crt /certs/haproxy.pem ssl-min-ver TLSv1.2
  default_backend app

backend app
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  option redispatch
  retries 2
  # Active checks: probe every 1s, down after 2 failures, up after 2 passes.
  server backend1 backend1:8080 check inter 1s fall 2 rise 2
  server backend2 backend2:8080 check inter 1s fall 2 rise 2
