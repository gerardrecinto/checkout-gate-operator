events {}
http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  upstream app {
    # Open source NGINX only checks passively: a backend is marked down after
    # a failed request, then retried after fail_timeout.
    server backend1:8080 max_fails=1 fail_timeout=3s;
    server backend2:8080 max_fails=1 fail_timeout=3s;
  }

  server {
    listen 8443 ssl;
    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://app;
      proxy_next_upstream error timeout http_503;
      proxy_connect_timeout 1s;
    }
  }
}
