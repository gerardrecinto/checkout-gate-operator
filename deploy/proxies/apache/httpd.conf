ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 8443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_hcheck_module modules/mod_proxy_hcheck.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so

ErrorLog /proc/self/fd/2
LogFormat "%h \"%r\" %>s" lab
CustomLog /proc/self/fd/1 lab

<VirtualHost *:8443>
  SSLEngine on
  SSLCertificateFile    /certs/tls.crt
  SSLCertificateKeyFile /certs/tls.key
  SSLProtocol -all +TLSv1.2 +TLSv1.3

  # mod_proxy_hcheck probes each member, so Apache has active checks too,
  # but they are a separate module with its own tuning, unlike HAProxy's
  # built-in check keyword.
  <Proxy "balancer://app">
    BalancerMember "http://backend1:8080" hcmethod=GET hcuri=/healthz hcinterval=1 hcfails=2 hcpasses=2 retry=1
    BalancerMember "http://backend2:8080" hcmethod=GET hcuri=/healthz hcinterval=1 hcfails=2 hcpasses=2 retry=1
  </Proxy>
  ProxyPass        "/" "balancer://app/" failonstatus=503
  ProxyPassReverse "/" "balancer://app/"
</VirtualHost>
