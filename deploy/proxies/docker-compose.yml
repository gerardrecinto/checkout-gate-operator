# Lab: NGINX, HAProxy and Apache httpd in front of two Go backends, TLS on
# 8441 (nginx), 8442 (haproxy), 8443 (apache). Self-signed cert:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout certs/tls.key -out certs/tls.crt -subj /CN=localhost
#   cat certs/tls.crt certs/tls.key > certs/haproxy.pem
# Then: docker compose up -d --build && ./failover.sh stop   (or: fail)

services:
  backend1:
    build: ./backend
    environment: { NAME: backend1 }
  backend2:
    build: ./backend
    environment: { NAME: backend2 }
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports: ["8441:8443"]
    depends_on: [backend1, backend2]
  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/certs:ro
    ports: ["8442:8443"]
    depends_on: [backend1, backend2]
  apache:
    image: httpd:2.4-alpine
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./certs:/certs:ro
    ports: ["8443:8443"]
    depends_on: [backend1, backend2]
