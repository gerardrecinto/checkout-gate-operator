# Apache reverse proxy in front of the operator's dashboard and status API.
#
# The Dockerfile already builds the Svelte frontend and copies the
# compiled static files into the runtime image at /frontend-dist, but
# nothing in the Go binary ever serves them - internal/apiserver only
# registers /api/gates, /api/gates/summary, and /healthz. Without
# something in front of it serving those static files, the dashboard
# the container ships is unreachable in a real deployment; the demo
# GIF in the README was captured against `npm run dev`, not the
# packaged container.
#
# This config is that missing piece: Apache serves the built dashboard
# directly (its own strength over a pure load balancer like HAProxy)
# and reverse-proxies API calls to the manager's status API, all in
# one vhost. Point DocumentRoot at wherever the frontend build output
# actually lands in your deployment (the Docker image path is
# /frontend-dist; adjust for a non-container deployment).
#
# Required modules: mod_proxy, mod_proxy_http, mod_headers.
# Enable with: a2enmod proxy proxy_http headers   (Debian/Ubuntu)
#          or: LoadModule lines below on macOS/RHEL httpd installs.

<VirtualHost *:8080>
    ServerName checkout-gate.local

    DocumentRoot "/frontend-dist"

    <Directory "/frontend-dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Svelte's router serves a single index.html for any path the
        # static file tree doesn't have, same idea as an nginx
        # try_files fallback.
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} !^/healthz
        RewriteRule ^ index.html [L]
    </Directory>

    # Everything under /api/ and the health check go to the manager's
    # status API (internal/apiserver, default :8081) instead of being
    # served as static files.
    ProxyPreserveHost On
    ProxyPass "/api/" "http://127.0.0.1:8081/api/"
    ProxyPassReverse "/api/" "http://127.0.0.1:8081/api/"
    ProxyPass "/healthz" "http://127.0.0.1:8081/healthz"
    ProxyPassReverse "/healthz" "http://127.0.0.1:8081/healthz"

    ErrorLog "logs/checkout-gate-error.log"
    CustomLog "logs/checkout-gate-access.log" combined
</VirtualHost>
