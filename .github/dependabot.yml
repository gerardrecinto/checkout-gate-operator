version: 2
updates:
  # Kubernetes libraries have to move together, so one PR bumps them all.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      prometheus:
        patterns:
          - "github.com/prometheus/*"
  # Svelte, Vite and TypeScript have to move together too.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-toolchain:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
          - "vite*"
          - "typescript"
    ignore:
      # svelte-check's peer range stops at TypeScript 6. Drop this once it allows 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
