name: vagrant-kvm

on:
  pull_request:
    paths: ['deploy/vagrant/**', '.github/workflows/vagrant-kvm.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Confirm KVM is available
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Vagrant and libvirt
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vagrant qemu-kvm libvirt-daemon-system libvirt-dev ruby-dev build-essential libxslt-dev libxml2-dev zlib1g-dev
          sudo usermod -aG libvirt "$USER"
          sudo vagrant plugin install vagrant-libvirt
          vagrant --version

      - name: Bring the VM up and provision it
        working-directory: deploy/vagrant
        env:
          VM_DNS: 1.1.1.1
        run: |
          set -o pipefail
          sudo --preserve-env=VM_DNS vagrant up --provider=libvirt 2>&1 | tee up.log

      - name: Show the provision result
        working-directory: deploy/vagrant
        run: |
          grep 'provision checks passed' up.log
          sudo vagrant destroy -f
